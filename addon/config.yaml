---
name: HomeElixir
version: 0.1.1
slug: home-elixir
description: Node-RED-style Elixir flow engine for Home Assistant
url: https://github.com/mogorman/home_elixir
# Pre-built, self-contained image. HA pulls this tag (appended from `version`
# above; no tag here).
image: ghcr.io/mogorman/home-elixir
arch:
  - amd64
homeassistant: "2023.3.0"
# Reaches this HA via the supervisor token automatically (no ha_url option).
# Reach the web UI from your reverse proxy / HA host on port 8080 (host network).
host_network: true
homeassistant_api: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Flow manager (point your reverse proxy at this)
map:
  - addon_config:rw
options:
  admin_password: ""
schema:
  admin_password: str?
