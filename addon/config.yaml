---
name: HomeElixir
version: 0.1.107
slug: home-elixir
description: Node-RED-style Elixir flow engine for Home Assistant
url: https://github.com/mogorman/home_elixir
# Pre-built, self-contained image. HA pulls this tag (appended from `version`
# above; no tag here).
image: ghcr.io/mogorman/home-elixir
arch:
  - amd64
  - aarch64
homeassistant: "2023.3.0"
homeassistant_api: true
# Embedded sidebar panel (ingress); the app serves under /api/ingress/<uuid>/.
ingress: true
ingress_port: 8090
panel_icon: mdi:water
panel_title: HomeElixir
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Direct access (enable via direct_port option)
map:
  - addon_config:rw
options:
  web_base_url: ""
  ha_external_url: ""
  direct_port: false
schema:
  web_base_url: str?
  ha_external_url: str?
  direct_port: bool
